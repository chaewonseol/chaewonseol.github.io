<style>

/* ---------- GENERAL ---------- */

body {
  margin: 0;
  background: #f8fbfd;
  color: #314956;
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.7;
}


/* ---------- NAVIGATION ---------- */

nav {
  background: white;
  border-bottom: 1px solid #dce8ee;
}

.nav-container {
  max-width: 1050px;
  margin: auto;
  padding: 22px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.name {
  font-family: Georgia, serif;
  font-size: 25px;
  color: #075985;
  text-decoration: none;
}

.nav-links a {
  margin-left: 32px;
  color: #496676;
  text-decoration: none;
  font-size: 15px;
}

.nav-links a:hover,
.nav-links a.active {
  color: #0284c7;
}


/* ---------- MAIN ---------- */

main {
  max-width: 900px;
  margin: 70px auto 100px;
  padding: 0 30px;
}

h1 {
  font-family: Georgia, serif;
  font-size: 44px;
  font-weight: normal;
  color: #075985;
  margin: 0;
}

.water-line {
  width: 70px;
  height: 3px;
  background: #38a9d6;
  border-radius: 10px;
  margin: 18px 0 50px;
}


/* ---------- RESEARCH SECTIONS ---------- */

.research-section {
  margin-bottom: 55px;
}

h2 {
  font-family: Georgia, serif;
  font-size: 27px;
  font-weight: normal;
  color: #075985;

  margin-bottom: 22px;
  padding-bottom: 8px;

  border-bottom: 1px solid #dce8ee;
}


/* ---------- PAPER CARDS ---------- */

.paper {
  background: white;
  border: 1px solid #dce8ee;
  border-radius: 10px;

  padding: 24px 28px;
  margin-bottom: 18px;

  box-shadow: 0 3px 12px rgba(40, 80, 100, 0.04);
}

.paper-title {
  font-family: Georgia, serif;
  font-size: 19px;
  line-height: 1.45;
  color: #253f4d;

  margin-bottom: 8px;
}

.authors {
  color: #608091;
  font-size: 14px;
  margin-bottom: 3px;
}

.publication {
  color: #0c7eaa;
  font-size: 14px;
  font-style: italic;
  margin-top: 5px;
}

.note {
  display: inline-block;

  margin-top: 10px;
  padding: 4px 11px;

  background: #eef7fb;
  color: #176987;

  border-radius: 20px;
  font-size: 12px;
}

.paper-description {
  margin-top: 13px;

  color: #536f7e;
  font-size: 14px;
  line-height: 1.65;
}


/* ---------- LINKS ---------- */

.paper-links {
  margin-top: 13px;
}

.paper-links a {
  color: #0c7eaa;
  text-decoration: none;
  font-size: 14px;
  margin-right: 13px;
}

.paper-links a:hover {
  color: #0284c7;
  text-decoration: underline;
}


/* ---------- JOB MARKET PAPER ---------- */

.research-section:nth-of-type(2) .paper {
  border-left: 4px solid #38a9d6;
}


/* ---------- FOOTER ---------- */

footer {
  max-width: 900px;
  margin: 40px auto 30px;
  padding: 25px 30px;

  border-top: 1px solid #dce8ee;

  color: #78909c;
  font-size: 13px;
  text-align: center;
}


/* ---------- MOBILE ---------- */

@media (max-width: 700px) {

  .nav-container {
    padding: 18px 20px;
  }

  .nav-links a {
    margin-left: 14px;
    font-size: 14px;
  }

  main {
    margin-top: 45px;
    padding: 0 25px;
  }

  h1 {
    font-size: 38px;
  }

  .paper {
    padding: 21px;
  }

}
